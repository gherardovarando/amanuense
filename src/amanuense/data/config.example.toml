# amanuense configuration. `amanuense init` copies this file to ~/.config/amanuense/config.toml.
# Every setting has a default; command-line options override this file.

# The categories file defines the categories (one `## name` section each, with description,
# examples and tag keyword). Manage it by hand or with `amanuense category`.
categories_file = "categories.md"   # relative to this file, or an absolute path

[owner]
# Whose mail it is, in a few words; it goes into the model's instructions.
description = "a university professor"
languages = "English or Spanish"

[window]
# Which mail a run covers (--window): 24h, 3d, 2w, today, yesterday, week, last
# (since the previous successful run), 2026-10-01, 2026-10-01..2026-10-05.
default = "24h"
unread = true          # also include unread mail outside the window (--unread / --no-unread)
max_unread = 100       # at most this many of those, newest first
max_messages = 300     # at most this many messages per run (~30 s each on a small CPU)

[mail]
account = ""           # account name in the IMAP MCP server; empty = its default account
inbox = "INBOX"
sent = "Sent"          # used to spot emails you already answered
# addresses = ["me@example.org", "m.e@example.org"]   # yours, with aliases: they never link two
#                                                     # emails as being about the same meeting

# Extra folders to read besides the inbox, e.g. a quarantine or oversized-mail folder that
# the server empties after some days. Repeat the [[folders]] block for each folder.
# [[folders]]
# name = "Quarantine"
# label = "held mail"     # shown in the digest
# expires_days = 14       # the server deletes mail here after N days: the digest warns,
#                         # and tasks are due before that
# all = true              # read the whole folder whatever the window (default); false = window only
# max_messages = 100

[mcp]
# How to start the IMAP MCP server (https://github.com/nikolausm/imap-mcp-server).
# amanuense only enables the tools a run needs: search and read, plus the keyword
# tools when tagging. Sending, moving, flagging and deleting are never enabled.
command = "node"
args = ["~/.local/share/imap-mcp-server/dist/index.js"]
env = {}               # extra environment variables for the server

[model]
api = "ollama"                      # "ollama", or "openai" for any OpenAI-compatible server
url = "http://localhost:11434"      # Ollama base URL, or e.g. http://localhost:8080/v1
name = "qwen3:4b-instruct"
api_key_env = ""                    # name of an environment variable holding an API key, if needed
body_chars = 3000                   # characters of each email body passed to the model (~1000 tokens)
num_ctx = 4096                      # context size (Ollama)
temperature = 0.0
timeout = 600                       # seconds per email
# think = false                     # Ollama: turn off "thinking" for reasoning models such as qwen3:4b
# prompt_file = "prompt.md"        # your own instructions for the model (`amanuense prompt copy`);
#                                   # used if the file exists, else the built-in ones

[output]
# Layout: brief, long, tiny, todo, counts, oneline, page (HTML), json, or your own template
# (`amanuense template list`, `amanuense template copy brief mine`).
template = "brief"
path = "~/amanuense/{date}.md"      # {date} = end of the window, {template} = template name; "-" prints to stdout
max_fyi = 10                        # brief, page: at most this many "worth knowing" lines
tiny_items = 3                      # tiny: how many to-dos to show
urgent_within = "3d"                # urgent = act within this; a deadline further away is never urgent
# Any other key you add here reaches templates as out.<key>.

# More files from the same run, each with its own layout:
# [[outputs]]
# template = "page"
# path = "~/amanuense/{date}.html"
# [[outputs]]
# template = "oneline"
# path = "~/amanuense/{date}.txt"

[skip]
# Mail matching these regular expressions (case-insensitive) is listed as skipped
# and never sent to the model.
enabled = true
subject = '\[(BULK|SPAM\?)\]|newsletter'
from = 'no-?reply|newsletter|mailer-daemon|notifications?@'

[waiting]
# Sent mail that asked for something and got no reply: listed under "Waiting for replies".
enabled = true         # --waiting / --no-waiting
# Durations: 36h, 7d, 2w, or a plain number of days.
after = "7d"           # waiting = no reply after this long (--waiting-after)
lookback = "30d"       # how far back to look at sent mail (--waiting-lookback)
max_messages = 50      # at most this many go to the model per run
tasks = false          # also add a follow-up task (--waiting-tasks)
task_tag = "followup"  # extra tag on those tasks

[taskwarrior]
# digest adds a task for each new to-do that has no task yet (checked against annotations,
# in any status, so completed or deleted tasks are never re-created).
enabled = "auto"       # "auto" = when the task command is installed; true; false (--tasks / --no-tasks)
command = "task"
tags = ["email"]       # added to every task, after the category tag (categories with keyword: none get none)
project = ""
rc = {}                # extra rc settings, e.g. { "data.location" = "~/.task-mail" }
# Mail that names the same reference as a pending task (e.g. a manuscript ID), in its subject or
# to-do, becomes a note on that task instead of a new one, even in a new thread. The default:
# references = ['\b[A-Z]{2,8}-D-\d{2}-\d{3,}\b', '\b[A-Z]{2,8}-\d{4}-\d{3,}(?:\.R\d+)?\b',
#               '(?<![\d.,:/-])\d{6,9}(?![\d.,:/-])']

[tag]
# The keyword for each category is set in the categories file (`keyword:` lines).
enabled = false        # digest also tags messages (same as digest --tag)
todo_keyword = ""      # also set this keyword on to-dos, e.g. "$label4" (Thunderbird "To Do")

[events]
# Emails that fix an event you attend (a meeting, call, talk, defence on a stated date) are listed in
# the digest. With url set, each is also added to that CalDAV calendar: tentative, private, once,
# never replaced or deleted. It uses the server and password of [calendar]. A separate calendar is best.
url = ""               # e.g. a calendar from `amanuense calendar list`; "" = list them only
minutes = 60           # length of an event whose end time the email doesn't say
# check = ["Personal"] # your own calendars, read only: no event is added if one of yours starts then

[sensitive]
# Mail with personal or sensitive material: its tasks name only the sender, and tagging sets
# the keyword below, so other tools and agents know to leave it closed.
# description = "health, ...; personal or family matters; ..."   # what counts, for the model
from = ""              # regular expressions: matching mail is sensitive whatever the model says
subject = ""
keyword = "sensitive"  # IMAP keyword on sensitive mail, when tagging; "" = none
screened = "screened"  # IMAP keyword on every email the model checked, when tagging; "" = none
task_tag = "sensitive" # Taskwarrior tag on their tasks

[calendar]
# Put each digest in a CalDAV calendar as a task (or event) due that morning, so a phone that
# syncs the calendar shows a reminder. Title: counts only (oneline); notes: the tiny digest.
enabled = false
server = "https://dav.example.org/"   # then `amanuense calendar list` shows the calendars
url = ""                              # one of them
username = ""
password_file = "~/.config/amanuense/caldav-password"   # one line, chmod 600; or:
# password_command = "pass show caldav"
kind = "task"                         # "task" (tick it off once read) or "event"
time = "07:30"                        # local time it's due (and its reminder)
minutes = 15
alarm = true
title_template = "oneline"
template = "tiny"
