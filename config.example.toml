# Copy to config.toml (ignored by git) and edit.

# Category names: the model must pick one of these. The last one is the fallback.
# Describe each one, with examples, in the categories file.
categories = ["research", "teaching", "admin", "events", "reviewing", "info"]
categories_file = "categories.md"   # relative to this folder, or an absolute path

[owner]
# Who the mail belongs to, in a few words; it goes into the model's instructions.
description = "a university professor"
languages = "English or Spanish"

[mail]
# Account name as configured in the IMAP MCP server.
account = "work"
inbox = "INBOX"
sent = "Sent"
# Besides the last 24 h, also triage older unread mail in the inbox (newest first, at most max_unread).
unread = true
max_unread = 100
# How to start the IMAP MCP server (https://github.com/nikolausm/imap-mcp-server).
server_command = "node"
server_args = ["~/.local/share/imap-mcp-server/dist/index.js"]

[model]
name = "qwen3:4b-instruct"
url = "http://localhost:11434/api/chat"
body_chars = 3000   # characters of each email body passed to the model (~1000 tokens)
num_ctx = 4096

[output]
dir = "~/mail-digest"      # the digest goes to <dir>/<YYYY-MM-DD>/<filename>
filename = "mail.md"

[skip]
# Regular expressions (case-insensitive). Matching mail is listed as skipped
# and never sent to the model.
subject = '\[(BULK|SPAM\?)\]|newsletter'
from = 'no-?reply|newsletter|mailer-daemon|notifications?@'
